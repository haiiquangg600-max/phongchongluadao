version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bld_postgres
    environment:
      POSTGRES_USER: baohiem
      POSTGRES_PASSWORD: baohiem_secret_2026
      POSTGRES_DB: baohiemluadao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baohiem -d baohiemluadao"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bld_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bld_backend
    environment:
      DATABASE_URL: postgresql://baohiem:baohiem_secret_2026@postgres:5432/baohiemluadao?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: baohiemluadao_jwt_secret_key_2026_very_long
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bld_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
